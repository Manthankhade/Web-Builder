      d="M 170 180 
         L 205 320 
         L 245 180 
         L 285 320 
         L 320 180 
         C 335 155 365 155 390 155 
         C 425 155 450 175 450 210 
         C 450 238 430 255 405 260 
         C 435 265 455 285 455 320 
         C 455 360 425 380 380 380 
